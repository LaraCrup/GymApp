<div style="font-family: Arial, sans-serif; font-size: 16px; line-height: 1.5; color: #0f172a; max-width: 480px;">
  <h1 style="font-size: 20px;">¡Hola! 👋</h1>
  <p>Te invitaron a <strong>Mis Rutinas</strong>, la app para anotar tus ejercicios y pesos del gimnasio.</p>
  <p>Tocá el botón para elegir tu contraseña:</p>
  <p style="margin: 28px 0;">
    <a href="{{ .SiteURL }}/clave?token_hash={{ .TokenHash }}&type=invite"

      Activar mi cuenta

  <p style="color: #475569; font-size: 14px;">Tu usuario es este email: {{ .Email }}</p>
</div>
